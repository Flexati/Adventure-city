name: Android smoke build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "game/**"
      - "tools/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/android-smoke-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Logic tests
        run: npm test

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Build and verify APK
        shell: bash
        run: |
          chmod +x tools/build_apk.sh
          tools/build_apk.sh
          test -s dist/City_Adventure_Districts_v0.5_debug.apk

      - name: Start Android emulator
        shell: bash
        run: |
          echo no | avdmanager create avd -n city_api35 -k "system-images;android-35;google_apis;x86_64" --force
          sudo chmod 666 /dev/kvm || true
          nohup emulator -avd city_api35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 90); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then break; fi
            sleep 2
          done
          [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]

      - name: Install and launch APK
        shell: bash
        run: |
          APK=dist/City_Adventure_Districts_v0.5_debug.apk
          adb install -r "$APK"
          adb logcat -c
          adb shell am force-stop com.cityadventure.pizzaprotocol.debug
          adb shell am start -W -n com.cityadventure.pizzaprotocol.debug/.MainActivity | tee launch.txt
          sleep 8
          adb shell pidof com.cityadventure.pizzaprotocol.debug | tee pid.txt
          test -s pid.txt
          adb shell dumpsys activity activities > activities.txt
          grep -q "com.cityadventure.pizzaprotocol.debug/.MainActivity" activities.txt
          adb logcat -d > logcat.txt
          if grep -E "FATAL EXCEPTION|AndroidRuntime.*Process: com\.cityadventure\.pizzaprotocol\.debug" logcat.txt; then
            echo "Fatal Android exception detected"
            exit 1
          fi
          adb exec-out screencap -p > city-adventure-launch.png
          test -s city-adventure-launch.png

      - name: Upload verified APK and launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: City-Adventure-v0.5-Android-smoke
          if-no-files-found: error
          path: |
            dist/City_Adventure_Districts_v0.5_debug.apk
            city-adventure-launch.png
            launch.txt
            pid.txt
            activities.txt
            logcat.txt
            emulator.log
