name: Android smoke build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "game/**"
      - "tools/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/android-smoke-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Logic tests
        run: npm test

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          AVDMANAGER="$(find "$ANDROID_SDK_ROOT" -type f -name avdmanager | head -n 1)"
          test -n "$SDKMANAGER"
          test -n "$AVDMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Build and verify APK
        shell: bash
        run: |
          chmod +x tools/build_apk.sh
          tools/build_apk.sh
          test -s dist/City_Adventure_Blackout_v0.6_debug.apk

      - name: Start Android emulator
        shell: bash
        run: |
          AVDMANAGER="$(find "$ANDROID_SDK_ROOT" -type f -name avdmanager | head -n 1)"
          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          echo no | "$AVDMANAGER" create avd -n city_api35 -k "system-images;android-35;google_apis;x86_64" --force
          sudo chmod 666 /dev/kvm || true
          nohup "$EMULATOR" -avd city_api35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > emulator.log 2>&1 &
          "$ANDROID_SDK_ROOT/platform-tools/adb" wait-for-device
          for i in $(seq 1 120); do
            if [[ "$("$ANDROID_SDK_ROOT/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then break; fi
            sleep 2
          done
          [[ "$("$ANDROID_SDK_ROOT/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]

      - name: Install and launch APK
        shell: bash
        run: |
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          APK=dist/City_Adventure_Blackout_v0.6_debug.apk
          "$ADB" install -r "$APK"
          "$ADB" logcat -c
          "$ADB" shell am force-stop com.cityadventure.pizzaprotocol.debug
          "$ADB" shell am start -W -n com.cityadventure.pizzaprotocol.debug/.MainActivity | tee launch.txt
          sleep 8
          "$ADB" shell pidof com.cityadventure.pizzaprotocol.debug | tee pid.txt
          test -s pid.txt
          "$ADB" shell dumpsys activity activities > activities.txt
          grep -q "com.cityadventure.pizzaprotocol.debug/.MainActivity" activities.txt
          "$ADB" logcat -d > logcat.txt
          if grep -E "FATAL EXCEPTION|AndroidRuntime.*Process: com\.cityadventure\.pizzaprotocol\.debug" logcat.txt; then
            echo "Fatal Android exception detected"
            exit 1
          fi
          "$ADB" exec-out screencap -p > city-adventure-launch.png
          test -s city-adventure-launch.png

      - name: Verify actual Android WebView gameplay
        shell: bash
        run: |
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          PID="$("$ADB" shell pidof com.cityadventure.pizzaprotocol.debug | tr -d '\r')"
          "$ADB" forward tcp:9222 "localabstract:webview_devtools_remote_$PID"
          node tools/verify_android_renderer.mjs
          "$ADB" exec-out screencap -p > city-adventure-gameplay.png

      - name: Upload verified APK and launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: City-Adventure-v0.6-Blackout-Android-smoke
          if-no-files-found: warn
          path: |
            dist/City_Adventure_Blackout_v0.6_debug.apk
            city-adventure-launch.png
            city-adventure-gameplay.png
            android-renderer-proof.json
            launch.txt
            pid.txt
            activities.txt
            logcat.txt
            emulator.log
