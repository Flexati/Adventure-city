name: Export repository bundle

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all refs
        run: |
          git fetch --all --tags --prune
          git for-each-ref --format='%(refname)' refs/remotes/origin/ | while read ref; do
            case "$ref" in
              refs/remotes/origin/HEAD) ;;
              *) branch="${ref#refs/remotes/origin/}"; git branch -f "$branch" "$ref" || true ;;
            esac
          done

      - name: Create full bundle
        run: |
          git bundle create city-adventure-full.bundle --all
          ls -lh city-adventure-full.bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: city-adventure-full-bundle
          path: city-adventure-full.bundle
          compression-level: 0
          retention-days: 1
