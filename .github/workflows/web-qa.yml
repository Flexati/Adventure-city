name: Web release-candidate QA
on:
  pull_request:
    paths: ['game/**', 'tools/**', 'tests/**', 'docs/production/v9/**', 'package*.json', '.github/workflows/web-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: V9 evidence integrity and save recovery
        run: |
          node tools/verify_v9_governance.mjs
      - name: Serve offline game
        run: python3 -m http.server 8090 --bind 127.0.0.1 > /tmp/city-server.log 2>&1 &
      - name: Web Audio rendering and app lifecycle
        shell: bash
        run: |
          node tools/verify_audio_v09.cjs http://127.0.0.1:8090/game/ audio-render.json 2>&1 | tee audio-render.log
          node tools/verify_runtime_v09.cjs http://127.0.0.1:8090/game/ runtime.json 2>&1 | tee runtime.log
          node tools/verify_save_recovery.cjs http://127.0.0.1:8090/game/ save-recovery.json 2>&1 | tee save-recovery.log
      - name: V9 combat and seven-race rivalry previews
        run: |
          node tools/verify_combat_v9.cjs http://127.0.0.1:8090/game/v9-combat-lab.html combat-v9
          node tools/verify_racing_v9.cjs http://127.0.0.1:8090/game/v9-race-lab.html racing-v9
      - name: Preserve browser failure in check annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          for name in ['save-recovery.log', 'runtime.log', 'audio-render.log']:
              file = pathlib.Path(name)
              if file.exists():
                  text = '\n'.join(file.read_text()[-6000:].splitlines()[-45:])
                  text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Browser QA ' + name + '::' + text)
                  break
          PY
      - name: V8 hub persistence and four viewport tour
        run: |
          node tools/verify_hubs_v8.cjs http://127.0.0.1:8090/game/ hubs-v8.json
          node tools/visual_tour.cjs http://127.0.0.1:8090/game/ tour-v8 moon,cathedral,toxic,clockwork,reunion,collapse,postcredits
      - name: Frame budget with audio and software rendering
        run: node tools/verify_performance_v09.cjs http://127.0.0.1:8090/game/ performance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-qa-evidence
          path: |
            audio-render.json
            runtime.json
            save-recovery.json
            audio-render.log
            runtime.log
            save-recovery.log
            performance.json
            hubs-v8.json
            tour-v8/
            combat-v9/
            racing-v9/

  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        path: [a, b, c]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Serve campaign
        run: python3 -m http.server 8090 --bind 127.0.0.1 > /tmp/city-campaign-server.log 2>&1 &
      - name: New Story through postcredits with real inputs
        env:
          CITY_VIRTUAL_TIME: '1'
        run: node tools/verify_campaign_browser.cjs http://127.0.0.1:8090/game/ ${{ matrix.path }} campaign-${{ matrix.path }}
      - name: Print bounded campaign diagnostics
        if: failure()
        env:
          CAMPAIGN_PATH: ${{ matrix.path }}
        run: |
          if test -f campaign-${{ matrix.path }}/environment.json; then cat campaign-${{ matrix.path }}/environment.json; fi
          if test -f campaign-${{ matrix.path }}/failure.json; then cat campaign-${{ matrix.path }}/failure.json; fi
          python3 - <<'PY'
          import json, os, pathlib
          directory = pathlib.Path('campaign-' + os.environ['CAMPAIGN_PATH'])
          file = directory / 'failure.json'
          if not file.exists(): file = directory / 'live.json'
          if file.exists():
              d = json.loads(file.read_text())
              s = d.get('snapshot', {})
              detail = {'message': d.get('message', 'See latest live snapshot'), 'status': d.get('status'), 'held': d.get('held'), 'elapsedMs': d.get('elapsedMs'), 'hero': {k:s.get(k) for k in ['x','y','hp','time','wave','status']}, 'nodes': s.get('nodes'), 'environment': d.get('environment')}
              text = json.dumps(detail, ensure_ascii=True)[:5000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Campaign diagnostic ' + os.environ['CAMPAIGN_PATH'] + '::' + text)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-v8-${{ matrix.path }}
          path: campaign-${{ matrix.path }}/
