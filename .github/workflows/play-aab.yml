name: Play AAB
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: versionCode Play (4 è il prossimo; il 3 è in caricamento)
        default: "4"
        required: true
permissions:
  contents: read
jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: SDK 36 e bundletool
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
      - name: Chiave di upload dai segreti
        env:
          KS_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
        run: |
          test -n "$KS_B64"
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: AAB firmato
        env:
          PLAY_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          PLAY_VERSION_CODE: ${{ inputs.version_code }}
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
        run: |
          npm ci
          npm run android:aab:play
      - uses: actions/upload-artifact@v4
        with:
          name: chronos-play-aab
          path: dist/*.aab
          if-no-files-found: error
