name: CHRONOS verified asset bridge smoke test
on:
  push:
    branches:
      - delivery/gpt-preproduzione-310-20261029
    paths:
      - .github/workflows/chronos-asset-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: delivery/gpt-preproduzione-310-20261029
      - name: Pack six actual PNG files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,zipfile,pathlib
          root=pathlib.Path('deliveries/gpt-preproduzione-310-20261029')
          files=sorted((root/'ability'/'ability_axis_spine').glob('*_vfx.png'))
          files += [root/'enemy'/'enemy_breaker'/'v01_vfx.png']
          assert len(files)==5 and all(p.is_file() for p in files)
          manifest={}
          with zipfile.ZipFile('CHRONOS_BRIDGE_REAL_5_PNG.zip','w',compression=zipfile.ZIP_STORED) as z:
              for p in files:
                  b=p.read_bytes()
                  assert b[:8]==b'\x89PNG\r\n\x1a\n',str(p)
                  manifest[str(p)]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
                  z.write(p,arcname=str(p))
              z.writestr('MANIFEST_SHA256.json',json.dumps(manifest,indent=2))
          print('Five PNG archived',sum(x['bytes'] for x in manifest.values()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CHRONOS_BRIDGE_REAL_5_PNG
          path: CHRONOS_BRIDGE_REAL_5_PNG.zip
          if-no-files-found: error
          retention-days: 30
