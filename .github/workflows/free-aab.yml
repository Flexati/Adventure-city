name: Free AAB
# R54 (D95): the free app (jaguarZcreatorZ13.app.free). Manual only, never publishes to the store; uploads the signed AAB as an artifact.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: versionCode of the free app (1 for the first upload)
        default: "1"
        required: true
permissions:
  contents: read
jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - uses: android-actions/setup-android@v3
      - name: SDK 36 e bundletool
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
      - name: Chiave di upload dai segreti
        env:
          KS_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
        run: |
          test -n "$KS_B64"
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: AAB firmato (free)
        env:
          PLAY_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          FREE_VERSION_CODE: ${{ inputs.version_code }}
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
        run: |
          npm ci
          npm run android:aab:free
      - uses: actions/upload-artifact@v4
        with:
          name: chronos-free-aab
          path: dist/*free*.aab
          if-no-files-found: error
