name: Restore canonical Solkara 01 from verified chunks
on:
  push:
    branches:
      - delivery/gpt-preproduzione-310-20261029
    paths:
      - 'deliveries/gpt-preproduzione-310-20261029/checkpoint_091/solkara_01_chunks/**'
      - 'deliveries/gpt-preproduzione-310-20261029/checkpoint_091/RESTORE_SOLKARA_01.mjs'
      - '.github/workflows/restore-chronos-solkara-01.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: delivery/gpt-preproduzione-310-20261029
          fetch-depth: 0
          persist-credentials: true
      - name: Verify source checksum and reconstruct exact PNG
        run: node deliveries/gpt-preproduzione-310-20261029/checkpoint_091/RESTORE_SOLKARA_01.mjs
      - name: Commit only SHA verified original
        run: |
          set -euo pipefail
          git add -- deliveries/gpt-preproduzione-310-20261029/region/region_solkara/v01.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets: restore verified original Solkara 01 day'
          for n in 1 2 3 4; do
            if git push origin HEAD:refs/heads/delivery/gpt-preproduzione-310-20261029; then exit 0; fi
            git fetch origin delivery/gpt-preproduzione-310-20261029
            git rebase origin/delivery/gpt-preproduzione-310-20261029
          done
          exit 1
